interface:
  display_name: "OpenSpec Continuous Change Workflow"
  short_description: "过滤 A/B 上下文的 OpenSpec 连续变更工作流"
  default_prompt: "Use $openspec-continuous-change-workflow to keep the main session as explore/brainstorm/controller only, then delegate one OpenSpec change before new change creation to a dedicated workflow subagent through clean commit, context compression, reload, and summary return. Treat workflow subagent wait timeouts as soft signals: inspect durable workflow state and identity evidence, send at most one status request to the same recorded subagent/session with an extended wait, and return a recovery blocker as a safety stop if durable state is missing or conflicting. When generated planning documents need review, the workflow subagent must return a planning-review request instead of launching nested A/B review; the Controller runs agent-review-dialogue, captures a durable result or blocker packet, filters raw A/B review context out of future prompts, and resumes only the same workflow subagent with the filtered packet. Never launch a replacement, take over lifecycle execution in the main session, or start the next change while the recorded subagent may still be running."

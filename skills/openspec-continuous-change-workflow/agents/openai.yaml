interface:
  display_name: "OpenSpec Continuous Change Workflow"
  short_description: "并行规划、串行实施的 OpenSpec 连续工作流"
  default_prompt: "Use $openspec-continuous-change-workflow to keep the main session as explore/brainstorm/controller and queue controller only, store workflow control state under uncommitted .workflow/openspec-continuous paths outside OpenSpec directories, allow multiple separable queued changes to plan in parallel, keep apply serialized by queue order, launch a fresh apply owner only for the queue head, let that owner dispatch scoped worker subagents only when write scopes are independent, run planning review through filtered Controller-relayed A/B, recycle planning subagents, apply owners, and workers after their roles complete, and exclude workflow control files and review coordination files from archive, staging, commit, and push."

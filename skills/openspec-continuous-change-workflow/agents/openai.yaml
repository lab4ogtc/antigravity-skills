interface:
  display_name: "OpenSpec Continuous Change Workflow"
  short_description: "主会话探索决策，独立子代理按持久状态执行每个变更"
  default_prompt: "Use $openspec-continuous-change-workflow to keep the main session as explore/brainstorm/controller only, then delegate one OpenSpec change before new change creation to a dedicated workflow subagent through clean commit, context compression, reload, and summary return. Treat workflow subagent wait timeouts as soft signals: inspect durable workflow state and identity evidence, send at most one status request to the same recorded subagent/session with an extended wait, and return a recovery blocker as a safety stop if durable state is missing or conflicting. Never launch a replacement, take over in the main session, or start the next change while the recorded subagent may still be running."
